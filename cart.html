
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | BIG GANG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="transition-screen">
    <div class="transition-logo">BIG GANG</div>
</div>    

<header class="header">
    <a href="index.html" class="logo">BIG GANG<span>®</span></a>

    <nav class="navigation">
        <a href="index.html#catalog">КАТАЛОГ</a>
        <a href="cart.html">
            КОРЗИНА
            <span class="cart-count" id="cart-count">0</span>
        </a>
    </nav>

    <div class="header-label">STREETWEAR / 2026</div>
</header>

<main class="cart-page">

    <section id="cart" class="cart-page-section">

        <div class="cart-heading">
            <p class="section-subtitle">YOUR SELECTION</p>
            <h2>КОРЗИНА</h2>
        </div>

        <div id="cart-items" class="cart-items">
            <p class="cart-empty">ЗАГРУЗКА КОРЗИНЫ...</p>
        </div>

        <div class="cart-summary">
            <p>ИТОГО: <span id="cart-total">0 ₽</span></p>

            <button id="checkout-button" class="checkout-button" disabled>
                ОФОРМИТЬ ЗАКАЗ
            </button>
        </div>

        <a href="index.html#catalog" class="back-to-catalog">
            ← ВЕРНУТЬСЯ В КАТАЛОГ
        </a>

    </section>

</main>

<!-- ОКНО ОФОРМЛЕНИЯ ЗАКАЗА -->

<div class="checkout-modal" id="checkout-modal" hidden>
    <div class="checkout-overlay" data-close-checkout></div>

    <div class="checkout-content">
        <button class="checkout-close" data-close-checkout>×</button>

        <div id="checkout-form-wrapper">
            <p class="section-subtitle">BIG GANG / CHECKOUT</p>
            <h2>ОФОРМЛЕНИЕ ЗАКАЗА</h2>

            <form id="checkout-form">

                <label for="customer-name">ВАШЕ ИМЯ</label>
                <input type="text" id="customer-name"
                    placeholder="Введите имя" required>

                <label for="customer-phone">НОМЕР ТЕЛЕФОНА</label>
                <input type="tel" id="customer-phone"
                    placeholder="+7 (999) 123-45-67" required>

                <label for="customer-address">АДРЕС ДОСТАВКИ</label>
                <input type="text" id="customer-address"
                    placeholder="Город, улица, дом" required>

                <button type="submit" class="checkout-submit">
                    ПОДТВЕРДИТЬ ЗАКАЗ
                </button>

            </form>
        </div>

        <div id="checkout-success" hidden>
            <p class="success-mark">✓</p>
            <h2>ЗАКАЗ СОЗДАН</h2>
            <p>СПАСИБО ЗА ПОКУПКУ!</p>
            <p id="success-order-number"></p>

            <button type="button" id="finish-order" class="checkout-submit">
                ВЕРНУТЬСЯ В МАГАЗИН
            </button>
        </div>

    </div>
</div>

<script src="cart.js"></script>

</body>
</html>
